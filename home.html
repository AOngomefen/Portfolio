    <!-- Popup overlay + box (accessible) -->
    <div id="popupOverlay" class="overlay" hidden></div>
    <div id="popupBox" class="popup-box" role="dialog" aria-modal="true" aria-labelledby="popupTitle" hidden>
      <button id="popupClose" class="btn-close" aria-label="Close popup">&times;</button>
      <h3 id="popupTitle">Hello!</h3>
      <p>This is a reversible popup example. It closes on Escape or by clicking outside.</p>
    </div>

    <!-- Scripts at end for performance -->
    <script>
      // Popup behavior
      (function () {
        const overlay = document.getElementById('popupOverlay');
        const popup = document.getElementById('popupBox');
        const closeBtn = document.getElementById('popupClose');

        function showPopup() {
          overlay.hidden = false;
          popup.hidden = false;
          overlay.style.display = 'block';
          popup.style.display = 'block';
          popup.focus && popup.focus();
        }
        function hidePopup() {
          overlay.hidden = true;
          popup.hidden = true;
          overlay.style.display = 'none';
          popup.style.display = 'none';
        }

        // Close handlers
        closeBtn.addEventListener('click', hidePopup);
        overlay.addEventListener('click', hidePopup);
        window.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') hidePopup();
        });

        // Expose for demo / future use
        window.showPopup = showPopup;
        window.hidePopup = hidePopup;
      })();
    </script>
